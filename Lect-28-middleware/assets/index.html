<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
</head>
<body>
      <h1>public folder</h1>
    <h1>Student Registration Form </h1>

    <form action="http://192.168.0.113:3000/register" method="POST">

        <div>
            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >
        </div>

        <br>

        <div>
            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <br>

        <div>
            <label for="address">Address:</label>
            <textarea
                id="address"
                name="address"
                rows="4"
                cols="30"
                placeholder="Enter your address"
                required
            ></textarea>
        </div>

        <br>

        <button type="submit">
            Submit
        </button>

    </form>

</body>
</html>
